services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESEARCHOS_DB_NAME}
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: ${RESEARCHOS_DB_PASSWORD}
    volumes:
      - researchos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchos -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://researchos:${RESEARCHOS_DB_PASSWORD}@postgres:5432/${RESEARCHOS_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://researchos:${RESEARCHOS_DB_PASSWORD}@postgres:5432/${RESEARCHOS_DB_NAME}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_started

volumes:
  researchos_postgres:
