services:
  postgres:
    image: postgres:16-alpine
    container_name: researchos-postgres
    environment:
      POSTGRES_DB: ${RESEARCHOS_DB_NAME:-researchos_test}
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: ${RESEARCHOS_DB_PASSWORD:-researchos_local_only}
    ports:
      - "5433:5432"
    volumes:
      - researchos_postgres:/var/lib/postgresql/data
      - ./apps/api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchos -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  researchos_postgres:
