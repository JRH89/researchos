services:
  postgres:
    image: postgres:16-alpine
    container_name: researchos-postgres
    environment:
      POSTGRES_DB: researchos_test
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: researchos_local_only
    ports:
      - "5433:5432"
    volumes:
      - researchos_postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchos -d researchos_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  researchos_postgres:
